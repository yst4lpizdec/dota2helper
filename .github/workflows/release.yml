# Сборка установщика на машине GitHub.
#
# Ставишь тег вида v0.1.0 — получаешь готовый установщик в релизе.
# Руками собирать ничего не нужно.
#
# Иконки в репозитории не лежат (47 МБ, качаются из открытого CDN
# Valve), поэтому перед сборкой их скачивает сам процесс. Данные
# (snapshot) лежат в репозитории — это полтора мегабайта.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Создать релиз и положить в него установщик. По умолчанию токен сборки
# только читает репозиторий, и последний шаг падал с 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Консоль машины GitHub — cp1252, а программа печатает по-русски:
    # без этого первый же print с кириллицей роняет шаг.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сверить версию с тегом
        shell: pwsh
        run: |
          # Программа сравнивает свою версию с тегом последнего релиза.
          # Если они разойдутся, собранное приложение будет считать себя
          # свежее (или старее), чем есть, и обновление сломается.
          $code = Get-Content backend/services/updates.py -Raw
          if ($code -notmatch 'VERSION\s*=\s*"([^"]+)"') {
            throw "не нашёл VERSION в services/updates.py"
          }
          $version = $matches[1]
          $tag = "${{ github.ref_name }}" -replace '^v', ''

          if ($tag -and $tag -ne $version -and "${{ github.ref_type }}" -eq "tag") {
            throw "тег $tag не совпадает с VERSION $version в services/updates.py"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
        id: version

      - name: Скачать иконки
        working-directory: backend
        run: python -c "from services.icons import download_all; print(download_all())"

      - name: Собрать программу
        run: pyinstaller --noconfirm --clean dota2helper.spec

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"

          # В одних образах windows-latest Inno Setup стоит, в других нет.
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\dota2helper.iss

      - name: Положить установщик в релиз
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Dota2Helper-setup.exe
          fail_on_unmatched_files: true
