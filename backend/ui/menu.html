<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dota2Helper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/windows.css">
<link rel="icon" href="/app-icon.png">
</head>
<body class="shell">

<!-- Оболочка: слева разделы, справа страница раздела.
     Плиток на главной больше нет — они означали ровно то же, что и
     разделы («куда пойти»), и дублировали это меню. -->
<div class="app">
    <nav class="side">
        <div class="side-brand">
            <img class="side-logo" src="/app-icon.png" alt="">
            <span>Dota2Helper</span>
        </div>

        <div class="side-nav" id="nav"></div>

        <div class="side-foot">
            <!-- Короткая сводка: она нужна в любом разделе, а не только
                 на главной. -->
            <!-- Нажатие открывает проверку подключения: раньше для
                 этого была отдельная ссылка на главной, но состояние и
                 так показано здесь. -->
            <!-- Выхода здесь нет: он в меню значка у часов, а закрытие
                 окна программу не останавливает. -->
            <button class="side-state" id="side-state" type="button"></button>
        </div>
    </nav>

    <main class="stage">
        <!-- Своя полоса заголовка: системной рамки у окна нет. За неё же
             окно и перетаскивают — иначе двигать его было бы нечем. -->
        <div class="titlebar" id="titlebar">
            <div class="win-buttons">
                <button class="win-btn" id="win-min" type="button" title="свернуть">
                    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                </button>
                <button class="win-btn close" id="win-close" type="button" title="закрыть окно">
                    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.2 3.2 8.8 8.8M8.8 3.2 3.2 8.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>

        <iframe class="frame" id="frame" title="раздел"></iframe>
    </main>
</div>

<script>
(function () {
    "use strict";

    /* Разделы. Порядок — от того, зачем приложение открывают чаще. */
    var SECTIONS = [
        ["home", "Главная", "/home",
         "M4 10.5 12 4l8 6.5V20h-5.5v-5h-5v5H4z"],
        ["browse", "Справочник", "/browse",
         "M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"],
        ["meta", "Мета", "/meta",
         "M4 19h16M7 16V9.5M12 16V5M17 16v-4.5"],
        ["counters", "Контрпики", "/counters",
         "M5.5 5.5 18 18M18 5.5 5.5 18"],
        ["settings", "Настройки", "/settings",
         "M12 8.9a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2M12 3v2.6M12 18.4V21M3 12h2.6M18.4 12H21M5.6 5.6l1.9 1.9M16.5 16.5l1.9 1.9M18.4 5.6l-1.9 1.9M7.5 16.5l-1.9 1.9"]
    ];

    var frame = document.getElementById("frame");
    var nav = document.getElementById("nav");

    var current = null;

    function open(name) {
        var found = null;

        SECTIONS.forEach(function (section) {
            if (section[0] === name) { found = section; }
        });

        if (!found || current === name) { return; }

        current = name;
        frame.src = found[2];

        Array.prototype.forEach.call(nav.children, function (node) {
            node.classList.toggle("on", node.dataset.name === name);
        });
    }

    SECTIONS.forEach(function (section) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "side-item";
        button.dataset.name = section[0];

        button.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'
            + section[3] + '" fill="none" stroke="currentColor"'
            + ' stroke-width="1.7" stroke-linejoin="round"'
            + ' stroke-linecap="round"/></svg>'
            + "<span>" + section[1] + "</span>";

        button.addEventListener("click", function () { open(section[0]); });

        nav.appendChild(button);
    });

    /* ---------------- мост к приложению ---------------- */

    /* Мост держит оболочка, а страницы разделов берут его отсюда: они
       лежат в том же окне, просто в рамке. */
    var bridge = null;

    window.__bridge = null;

    window.__tell = function (method, arg) {
        if (!bridge || !bridge[method]) { return; }

        if (arg === undefined) { bridge[method](); } else { bridge[method](arg); }
    };

    function connect() {
        if (!window.qt || !window.qt.webChannelTransport) { return; }

        var script = document.createElement("script");
        script.src = "qrc:///qtwebchannel/qwebchannel.js";

        script.onload = function () {
            new QWebChannel(window.qt.webChannelTransport, function (channel) {
                bridge = channel.objects.app;
                window.__bridge = bridge;

                refresh();
            });
        };

        document.head.appendChild(script);
    }

    /* ---------------- своя рамка окна ---------------- */

    var titlebar = document.getElementById("titlebar");

    /* Перетаскивание отдаётся системе: страница только сообщает, что
       кнопку нажали на заголовке. Свой счёт смещений залипал — отпускание
       над рамкой раздела или за краем окна до страницы не доходило,
       и окно ездило за мышью без нажатия. */
    titlebar.addEventListener("mousedown", function (event) {
        if (event.button !== 0 || event.target.closest(".win-btn")) { return; }

        event.preventDefault();
        window.__tell("windowStartMove");
    });

    document.getElementById("win-min").addEventListener("click", function () {
        window.__tell("windowMinimize");
    });

    document.getElementById("win-close").addEventListener("click", function () {
        window.__tell("windowClose");
    });

    /* ---------------- состояние в подвале ---------------- */

    var side = document.getElementById("side-state");

    function dot(mark, text) {
        var row = document.createElement("div");
        row.className = "side-dot " + mark;
        row.innerHTML = "<i></i><span>" + text + "</span>";

        return row;
    }

    /* Проверка подключения живёт в настройках целиком: где конфиг,
       стоит ли параметр запуска, кнопка «поставить заново». */
    side.addEventListener("click", function () {
        open("settings");

        var page = frame.contentWindow;

        if (page && page.__showSetup) { page.__showSetup(); }
    });

    function refresh() {
        if (!bridge || !bridge.status) { return; }

        bridge.status(function (raw) {
            var now;

            try { now = JSON.parse(raw); } catch (error) { return; }

            side.innerHTML = "";

            side.appendChild(dot(
                now.match ? "ok" : (now.dota ? "idle" : "off"),
                now.match ? "идёт матч"
                    : (now.dota ? "Dota 2 запущена" : "Dota 2 не запущена")));

            side.appendChild(dot(now.server ? "ok" : "bad",
                now.server ? "приёмник работает" : "приёмник молчит"));
        });
    }

    setInterval(refresh, 2000);

    /* Приложение может попросить открыть раздел — например, когда
       «Справочник» выбирают в значке у часов. */
    window.__open = open;

    connect();
    open("home");
}());
</script>
</body>
</html>
